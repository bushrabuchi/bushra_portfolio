<section class="panel detail-panel">
  <div class="container">
    <div class="section-label">02 · SKILLS</div>
    <div class="heading-row">
      <div>
        <h2 class="big-title">Skills &amp; <span>technologies.</span></h2>
        <p>
          A practical toolkit spanning Angular development, frontend frameworks, APIs, data and testing.
        </p>
      </div>
      <div class="stack-badge">CORE FOCUS<br /><b>ANGULAR &amp; FRONTEND</b></div>
    </div>
    <div class="skill-grid">
      <article class="skill-card" *ngFor="let group of groups">
        <div class="skill-head">
          <div>
            <b>{{ group.title }}</b
            ><small>{{ group.caption }}</small>
          </div>
        </div>
        <ul class="skill-list">
          <li *ngFor="let skill of group.skills">{{ skill.name }}</li>
        </ul>
      </article>
    </div>
  </div>
</section>
