<section class="panel detail-panel">
  <div class="container">
    <div class="section-label">04 · PROJECTS</div>
    <div class="projects-heading">
      <div>
        <h2 class="big-title">Selected <span>work.</span></h2>
        <p>Open a project when you want the details — keeping the portfolio clean and focused.</p>
      </div>
      <span class="count">{{ projects.length }} FEATURED</span>
    </div>
    <div class="project-grid">
      <article class="project-card" *ngFor="let project of projects; let i = index">
        <div class="project-art">
          <span>{{ project.number }}</span>
          <div class="window">
            <div class="window-top"><i></i><i></i><i></i></div>
            <div class="chart"><b></b><b></b><b></b><b></b><b></b></div>
          </div>
          <em>{{ project.type }}</em>
        </div>
        <div class="project-body">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="tags">
            <span *ngFor="let item of project.stack">{{ item }}</span>
          </div>
          <div class="project-actions">
            <a [href]="project.demo">Live Demo ↗</a><a [href]="project.github">GitHub ↗</a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
